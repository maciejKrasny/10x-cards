name: "AI Code Review"
description: "Run the AI code reviewer on the current PR"

inputs:
  openrouter-api-key:
    description: "OpenRouter API key"
    required: true
  model:
    description: "OpenRouter model id (e.g. google/gemma-4-31b-it:free)"
    required: true
  github-token:
    description: "Token used by gh CLI to post comments and toggle labels"
    required: true
  pr-number:
    description: "Pull request number"
    required: true
  base-ref:
    description: "Base ref (branch or SHA) to diff against"
    required: true
  head-ref:
    description: "Head ref (branch or SHA) of the PR"
    required: true
  max-diff-lines:
    description: "Maximum diff lines to send to the model (default 3000)"
    required: false
    default: "3000"
  log-level:
    description: "Reviewer log level: debug | info | warn | error (default info)"
    required: false
    default: "info"
  max-findings:
    description: "Maximum per-line findings rendered in the PR comment (default 20)"
    required: false
    default: "20"

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npm ci

    - name: Build reviewer package
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npm run --workspace @10x-cards/code-reviewer build

    - name: Resolve base ref
      id: resolve-base
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        REF="${{ inputs.base-ref }}"
        if git rev-parse --verify --quiet "$REF" >/dev/null; then
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
        elif git rev-parse --verify --quiet "origin/$REF" >/dev/null; then
          echo "ref=origin/$REF" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Cannot resolve base ref '$REF' (tried '$REF' and 'origin/$REF')" >&2
          exit 1
        fi

    - name: Run AI code review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        AI_CR_MODEL: ${{ inputs.model }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_REF: ${{ steps.resolve-base.outputs.ref }}
        HEAD_REF: ${{ inputs.head-ref }}
        AI_CR_MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
        AI_CR_LOG_LEVEL: ${{ inputs.log-level }}
        AI_CR_MAX_FINDINGS: ${{ inputs.max-findings }}
      run: node packages/code-reviewer/dist/cli.js
