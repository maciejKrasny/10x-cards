name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - name: Env-var rollout gate
        if: github.event_name == 'pull_request'
        run: npm run check:env-rollout
      - run: npm run typecheck
      - run: npm test
      - name: Start local Postgres for type generation
        run: npx supabase db start
      - name: Apply migrations and regenerate types
        run: |
          npx supabase db reset --no-seed
          npm run db:types
      - name: Verify generated types are in sync
        run: |
          if ! git diff --exit-code src/db/database.types.ts; then
            echo "::error::src/db/database.types.ts is out of sync with the latest migration."
            echo "Fix: run 'npm run db:types && git add src/db/database.types.ts' locally and commit the result."
            exit 1
          fi
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  ai-code-review:
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
      contents: read
    concurrency:
      group: ai-cr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ai-code-review
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ vars.AI_CR_MODEL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-ref: ${{ github.event.pull_request.head.sha }}
